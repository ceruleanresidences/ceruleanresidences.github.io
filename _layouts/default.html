<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#174c55">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
          <span class="wordmark-mark" aria-hidden="true">C</span>
          <span>{{ site.title }}</span>
        </a>
        <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-navigation">
          <span class="visually-hidden">Toggle navigation</span>
          <span aria-hidden="true">Menu</span>
        </button>
        <nav id="site-navigation" class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">Journal</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="{{ '/archive/' | relative_url }}">Archive</a>
        </nav>
      </div>
    </header>

    <main id="content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <p>© {{ site.time | date: '%Y' }} {{ site.title }}.</p>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </div>
    </footer>
    <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
  </body>
</html>
