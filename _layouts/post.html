---
layout: default
---
<article class="article shell">
  <header class="article-header">
    <p class="eyebrow">{{ page.categories | first | default: 'Journal' }}</p>
    <h1>{{ page.title }}</h1>
    <p class="article-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>{% if page.author %} <span aria-hidden="true">·</span> {{ page.author }}{% endif %}</p>
  </header>
  <div class="article-content">
    {{ content }}
  </div>
  <footer class="article-footer">
    <a href="{{ '/' | relative_url }}">← Back to the journal</a>
  </footer>
</article>
